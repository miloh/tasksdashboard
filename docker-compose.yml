services:
  app-dev:
    build:
      context: .
      target: development
      dockerfile: Dockerfile
    container_name: taskboard-app-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    env_file:
      - .env.local
    depends_on:
      - pocketbase
    networks:
      - taskboard-network
    restart: unless-stopped

  app-prod:
    build:
      context: .
      target: production
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_POCKETBASE_URL: ${NEXT_PUBLIC_POCKETBASE_URL}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME}
        NEXT_PUBLIC_SITE_TAGLINE: ${NEXT_PUBLIC_SITE_TAGLINE}
        NEXT_PUBLIC_SITE_DESCRIPTION: ${NEXT_PUBLIC_SITE_DESCRIPTION}
        NEXT_PUBLIC_LOGO_PATH: ${NEXT_PUBLIC_LOGO_PATH}
    container_name: taskboard-app-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env.local
    depends_on:
      - pocketbase
    networks:
      - taskboard-network
    restart: unless-stopped
    profiles:
      - production

  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.pocketbase
    container_name: taskboard-pocketbase
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb/pb_data
      - ./pb_schema.json:/pb/pb_schema.json:ro
    networks:
      - taskboard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pb_data:
    driver: local

networks:
  taskboard-network:
    driver: bridge
